# Static site — no build step.
#
# Deliberately no [build] section: this repo has deployed from its root via the
# site's dashboard settings since 2018. Declaring publish/command here would
# override those working settings, so we only add headers.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hashless asset names, so keep these short-lived and let the HTML revalidate.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
