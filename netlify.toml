# Static site — no build step.
#
# Deliberately no publish/command here: this repo publishes from its root via
# the site's dashboard settings (publishOrigin: ui). Declaring them would
# override those known-good settings.

# ⚠ BUILDS ARE CURRENTLY BLOCKED — and not by anything in this repo.
#
# The site has @netlify/plugin-lighthouse installed at the site level, pinned
# to major v4. That version declares engines ">=14.15 <20" while Netlify's
# build image now runs Node 22, so config resolution fails before the site is
# ever published:
#
#   The Node.js version is 22.23.1 but the plugin
#   "@netlify/plugin-lighthouse" requires >=14.15 <20
#
# This predates the redesign. The site simply has not been rebuilt since May
# 2023, and Netlify's default Node moved on underneath it.
#
# Two repo-side fixes were tried and neither works:
#   1. NODE_VERSION = "18" — applied (it appeared in the resolved env) but the
#      runtime stayed 22, because plugin engines are checked against the build
#      image's own Node, not the version requested for the build.
#   2. Declaring the plugin here — took precedence (origin flipped ui→config)
#      but Netlify still installed v4, since the version pin lives at the site
#      level rather than in this file.
#
# THE FIX, in the Netlify UI:
#   Project configuration → Build & deploy → Build plugins → remove
#   "Lighthouse". The site has no build step at all, so Node exists solely to
#   run that plugin; removing it unblocks every deploy.
#
# If you want Lighthouse reports back afterwards, install a current version
# rather than v4.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hashless asset names, so keep these short-lived and let the HTML revalidate.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
