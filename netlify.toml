# Static site — no build step.
#
# Deliberately no publish/command here: this repo publishes from its root via
# the site's dashboard settings (publishOrigin: ui). Declaring them would
# override those known-good settings.

# The site has @netlify/plugin-lighthouse installed from the Netlify UI, pinned
# to major v4. That version declares engines ">=14.15 <20" while Netlify's
# build image now runs Node 22, so config resolution fails before the site is
# ever published:
#
#   The Node.js version is 22.23.1 but the plugin
#   "@netlify/plugin-lighthouse" requires >=14.15 <20
#
# Setting NODE_VERSION does not help — plugin compatibility is checked against
# the build image's own Node, not the version requested for the build.
#
# Declaring the plugin here instead: file config takes precedence over the UI
# entry, which should resolve a current version whose engines allow Node 22.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hashless asset names, so keep these short-lived and let the HTML revalidate.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
