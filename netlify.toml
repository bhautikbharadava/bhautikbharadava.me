# Static site — no build step.
#
# Deliberately no publish/command here: this repo publishes from its root via
# the site's dashboard settings (publishOrigin: ui). Declaring them would
# override those known-good settings.
#
# Historical note, so nobody re-derives this the hard way:
#
# Builds failed for a while after the 2026 redesign, and it had nothing to do
# with this repo. @netlify/plugin-lighthouse was pinned at major v4, which
# declares engines ">=14.15 <20", while the site's Node was set to 16.x — a
# version the Ubuntu Noble 24.04 build image doesn't ship, so it silently fell
# back to 22. Config resolution then died with:
#
#   The Node.js version is 22.23.1 but the plugin
#   "@netlify/plugin-lighthouse" requires >=14.15 <20
#
# Neither repo-side workaround helps, so don't reach for them again:
#   1. NODE_VERSION here is applied but ignored for this check — plugin engines
#      are validated against the build image's own Node, not the requested one.
#   2. Declaring the plugin here takes precedence (origin flips ui→config) but
#      Netlify still installs the site-level pinned version.
#
# Fixed in the dashboard instead: Lighthouse moved v4 → 6.0.1, and Node 16.x →
# 24.x. Both are site settings, not file settings.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hashless asset names, so keep these short-lived and let the HTML revalidate.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
